name: housekeep
description: HouseKeep home maintenance app
publish_to: 'none'
version: 1.0.0+11

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  go_router: ^14.0.0
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0
  flutter_timezone: ^4.1.1
  purchases_flutter: ^8.0.0
  firebase_core: ^3.0.0
  firebase_analytics: ^11.0.0
  firebase_crashlytics: ^4.0.0
  intl: ^0.20.2
  uuid: ^4.3.0
  image_picker: ^1.0.0
  shared_preferences: ^2.2.0
  home_widget: ^0.6.0
  url_launcher: ^6.2.0
  in_app_review: ^2.0.9
  package_info_plus: ^8.0.0
  app_settings: ^5.1.1
  pdf: ^3.11.0
  printing: ^5.13.0
  share_plus: ^10.0.0
  material_symbols_icons: ^4.2719.3
  google_fonts: ^6.2.1
  google_api_availability: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.16.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.0
  riverpod_lint: ^2.3.0
  mocktail: ^1.0.0
  shared_preferences_platform_interface: ^2.4.2
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/templates/
    - assets/images/
    - assets/images/demo/
    - assets/branding/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic-Variable.ttf
          style: italic

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#2E7D6F"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  min_sdk_android: 23
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter_native_splash:
  color: "#FAFAF8"
  image: assets/branding/splash_logo.png
  color_dark: "#0F1E19"
  image_dark: assets/branding/splash_logo_dark.png
  android_12:
    color: "#FAFAF8"
    image: assets/branding/splash_logo.png
    color_dark: "#0F1E19"
    image_dark: assets/branding/splash_logo_dark.png
  android: true
  ios: true
  web: false
  fullscreen: false
